spring.application.name=imagejobs
spring.datasource.url=jdbc:postgresql://localhost:5432/imagejobs
spring.datasource.username=imagejobs
spring.datasource.password=imagejobs
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.open-in-view=false
# Monitoring: only the health endpoint is exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Keep the logs readable
spring.jpa.show-sql=false