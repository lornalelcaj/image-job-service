services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: imagejobs
      POSTGRES_PASSWORD: imagejobs
      POSTGRES_DB: imagejobs
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagejobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/imagejobs
    volumes:
      - image-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  image-storage: