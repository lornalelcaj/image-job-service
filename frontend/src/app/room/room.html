<p><a routerLink="/">← Make a new puzzle</a></p>

@if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  <div class="room-header">
    <p>Room code: <span class="code">{{ code() }}</span></p>
    <div class="share">
      <input #linkInput type="text" readonly [value]="shareLink()" (focus)="linkInput.select()" />
      <button type="button" (click)="copyLink(linkInput)">{{ copied() ? 'Copied!' : 'Copy link' }}</button>
    </div>
    <p class="hint">Share the link or the code with your friends to solve this puzzle together.</p>
  </div>

  @if (connection(); as conn) {
    @if (conn.status() === 'closed' && conn.closeReason()) {
      <p class="error">
        {{ conn.closeReason() }}
        <button type="button" (click)="reconnect()">Reconnect</button>
      </p>
    }
    <app-board [jobId]="jobId()!" [connection]="conn" />
  }
}
