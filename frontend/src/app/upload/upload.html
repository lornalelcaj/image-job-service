<div class="join">
  <span>Have a code from a friend?</span>
  <input type="text" placeholder="ROOM CODE" maxlength="5"
         [value]="joinCode()"
         (input)="joinCode.set($any($event.target).value)"
         (keyup.enter)="joinRoom()" />
  <button type="button" [disabled]="!joinCode().trim()" (click)="joinRoom()">Join</button>
</div>

<input type="file" accept="image/*" (change)="onFileSelected($event)" />
<p>Selected: {{ file()?.name }}</p>

<label>
  Rows: {{ rows() }}
  <input type="range" min="2" max="10" [value]="rows()"
         (input)="rows.set(+$any($event.target).value)" />
</label>

<label>
  Columns: {{ cols() }}
  <input type="range" min="2" max="10" [value]="cols()"
         (input)="cols.set(+$any($event.target).value)" />
</label>

<p>{{ rows() * cols() }} pieces</p>

<button type="button" [disabled]="!file()" (click)="generate()">
  Generate puzzle
</button>
@if (error()) {
  <p class="error">{{ error() }}</p>
}


@if (job(); as current) {
  <p>Status: {{ current.status }}</p>

  @if (current.status === 'FAILED') {
    <p class="error">{{ current.errorMessage }}</p>
  }

  @if (current.status === 'DONE') {
    <button type="button" class="friends" [disabled]="creatingRoom()" (click)="playWithFriends(current.id)">
      👥 Play with friends
    </button>
    <app-board [jobId]="current.id" />
  }
}
