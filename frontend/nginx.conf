# Only uploads (POST requests) count towards the rate limit.
map $request_method $upload_client {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $upload_client zone=uploads:10m rate=10r/m;

# WebSocket connections need the Upgrade/Connection headers passed through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    location /jobs {
        limit_req zone=uploads burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rooms {
        limit_req zone=uploads burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h; # keep idle game connections open
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
